version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: btc-algo-postgres
    environment:
      POSTGRES_USER: btc_algo
      POSTGRES_PASSWORD: your_secure_password
      POSTGRES_DB: btc_algo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btc_algo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: btc-algo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: btc-algo-app
    environment:
      ENVIRONMENT: development
      DEBUG: "True"
      LOG_LEVEL: DEBUG
      MODE: paper
      DATABASE_URL: postgresql://btc_algo:your_secure_password@postgres:5432/btc_algo
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: python src/main.py

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    container_name: btc-algo-nginx
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: btc-algo-network
