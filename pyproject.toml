[project]
name = "btc-algo-platform"
version = "0.1.0"
description = "Production-oriented BTC/USDT algorithmic trading platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "ccxt>=4.4,<5",
  "pandas>=2.2,<3",
  "numpy>=2.1,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "redis>=5,<6",
  "structlog>=24,<26",
  "tenacity>=9,<10",
  "prometheus-client>=0.21,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
